# 記法ガイド

このWikiのページは、HTMLファイルの中に **Markdown** で書きます。ここでは書き方と、このWiki独自の記法をまとめます。

## 編集のしかた

このWikiは GitHub で管理しています。編集には GitHub のアカウントが必要です。

1. 直したいページを開き、タイトルの下にある「編集」を押す
2. GitHub の編集画面が開くので、本文（`<script type="text/markdown">` のすぐ下から始まる部分）を書き換える
3. 右上の「Commit changes...」を押し、何を変えたかを一言書いて保存する
4. 数分たつと、公開されているページに反映される

共同編集者として招待されていない人が編集した場合、変更は「提案」（プルリクエスト）として送られ、管理者が確認してから反映されます。

タイトルの下の「履歴」を押すと、そのページがいつ・誰に・どう変更されたかを見られます。

:::note
内容を大きく書き換えたときは、`assets/pages.js` にあるそのページの `updated`（更新日）も直してください。メインページの「最近の更新」は、この日付の順に並びます。
:::

## ページを増やす

### ゲームにページを足す

1. `games/_template/page.html` を、そのゲームのフォルダ（例: `games/county-of-fortune/`）にコピーして名前を変える
2. `<script type="text/markdown">` の中に本文を書く
3. `assets/pages.js` の、そのゲームの `pages` に1行足す

```js
{ file: "bosses.html", title: "ボス", updated: "2026-11-16" },
```

### ゲームを足す

1. `games/_template/` フォルダをまるごとコピーして、フォルダ名をゲームのID（半角英数とハイフン）にする
2. `assets/pages.js` の `games` にゲームを1件足す（既存のものをコピーして書き換える）

:::note
`pages.js` に書いた内容から、サイドバー・タブ・検索・メインページの一覧が作られます。書き忘れてもページ自体は開けますが、どこからもリンクされません。
:::

## 基本のMarkdown

````
# ページタイトル（1ページに1つ、先頭に書く）
## 大見出し（目次に載る）
### 小見出し（目次に載る）

**太字**　*斜体*　~~打ち消し~~　`コード`

- 箇条書き
  - 入れ子
1. 番号つき

[外部リンク](https://example.com)
![画像の説明](img/screenshot.png)

> 引用
````

改行は、書いたとおりに改行として表示されます。段落を分けるときは空行を入れます。

## ページへのリンク

ページのタイトルを `[[ ]]` で囲むとリンクになります。

| 書き方 | 意味 |
|---|---|
| `[[プレイメモ]]` | 同じゲームの「プレイメモ」ページ |
| `[[County of Fortune]]` | そのゲームのトップページ |
| `[[County of Fortune/やること]]` | ゲームを指定してページへ |
| `[[プレイメモ\|メモはこちら]]` | 表示する文字を変える |
| `[[#表]]` | 同じページの見出しへ |

実際の表示: [[County of Fortune]] ／ [[County of Fortune/やること]] ／ [[まだ無いページ]]

まだ作っていないページへのリンクは赤く表示されます。「あとで書く」の目印に使えます。

## ネタバレの折りたたみ

````
:::spoiler 終盤の展開
ここに書いた内容は、クリックするまで隠れます。
:::
````

:::spoiler 終盤の展開
ここに書いた内容は、クリックするまで隠れます。
- リストや表も入れられます
:::

タイトルを省くと「ネタバレ（クリックで開く）」と表示されます。

## 囲み

````
:::note 覚え書き
補足や覚え書きに使います。
:::

:::warn
取り返しのつかない要素など、注意したいことに使います。
:::

:::stub
````

:::note 覚え書き
補足や覚え書きに使います。
:::

:::warn
取り返しのつかない要素など、注意したいことに使います。
:::

:::stub

`:::stub` だけは1行で完結します（閉じの `:::` は不要）。後ろに文字を書くと、その文字が続けて表示されます。

## チェックリスト

````
- [ ] まだやっていないこと
- [x] 最初からチェック済みにしたいこと
````

- [ ] まだやっていないこと
- [x] 最初からチェック済みにしたいこと
- [ ] クリックで切り替えられます

チェックの状態は、見ているブラウザにだけ保存されます（別の端末・別のブラウザには引き継がれません）。項目の文章を書き換えると、その項目のチェックは外れます。

## 基礎情報ボックス

ページの右上に出る、Wikipedia風の情報ボックスです。`項目 | 内容` の形で1行ずつ書きます。`|` のない行は横いっぱいに表示されるので、画像を置くのに使えます。

````
:::infobox ゲームタイトル
![パッケージ画像](img/cover.jpg)
ジャンル | RPG
対応機種 | PC
発売日 | 2026年11月5日
:::
````

## 生産チェーンの図

建物と品物の流れを図にします。1行にひとつの流れを、`建物: 作るもの` を `→` でつないで書きます。

````
:::chain
小麦農場 / ライ麦農場: 穀物 → 水車: 小麦粉 → ベーカリー: パン
:::
````

:::chain
小麦農場 / ライ麦農場: 穀物 → 水車: 小麦粉 → ベーカリー: パン
:::

| 書き方 | 意味 |
|---|---|
| `水車: 小麦粉` | 建物と、そこで作るもの |
| `牛牧場: 牛肉, 牛乳, 獣皮` | 作るものが複数あるときは `,` で並べる |
| `小麦農場 / ライ麦農場: 穀物` | どちらの建物でもよいときは `/` で並べる |
| `獣皮 → 皮なめし工房: なめし皮` | 建物の前に、材料にする品物を書く |
| `木材 + なめし皮 → 玩具工房: 玩具` | 材料が複数あるときは `+` でつなぐ |
| `伐採場: 木材 10` | 品物の後ろに数字を書くと、数量として表示する |

行は何行でも書けます。行どうしは**品物の名前**でつながるので、名前は一字一句そろえてください。材料が複数ある建物は、材料ごとに枝分かれした図になります。

````
:::chain
牛牧場: 牛肉 4, 牛乳 6, 獣皮 2
獣皮 2 → 皮なめし工房: なめし皮 1
伐採場: 木材 10
木材 2 + なめし皮 1 → 玩具工房: 玩具 3
:::
````

:::chain
牛牧場: 牛肉 4, 牛乳 6, 獣皮 2
獣皮 2 → 皮なめし工房: なめし皮 1
伐採場: 木材 10
木材 2 + なめし皮 1 → 玩具工房: 玩具 3
:::

（上の数字は記法の例で、実際のゲームのデータではありません）

- 材料を書かずに `→` でつなぐと、前の建物が作ったものがそのまま次の建物の材料になります。作るものが複数ある建物の後ろでは、`→ 獣皮 →` のように使う品物を書いてください。
- 同じ品物を作る建物を別々の行に書くと、「どれか」の枠でまとめて表示します。建物ごとに数量が違うときに使います。
- `:::chain 玩具` のように後ろに文字を書くと、図の上に題として表示します。ひとつの見出しの下に図をいくつも並べるときに使います。
- 建物ひとつで作れる品物だけを何行も書くと、箱を横に並べて表示します。
- 記号は全角（：、＋、／）でも、矢印は `->` でも書けます。
- `:::chainindex` と1行書くと、そのページの図から「品物ごとの作る建物・使う建物」の表を自動で作ります。

## 書くときの注意

- 本文の中に、script の閉じタグ（&lt;/script&gt;）をそのまま書くことはできません。そこでページが途切れます。書きたいときは `&lt;/script&gt;` と書きます。
- 画像は各ゲームのフォルダに `img/` を作って置き、`![説明](img/ファイル名.png)` で貼ります。
- 公開するWikiなので、公式の画像や他サイトの文章をそのまま載せるのは避け、自分のスクリーンショットと自分の言葉で書くのが安全です。
- ローカルでファイルを直接開いているとき、検索はタイトルとタグだけが対象です。公開後は本文も検索できます。

# 記法ガイド

このWikiのページは、HTMLファイルの中に **Markdown** で書きます。ここでは書き方と、このWiki独自の記法をまとめます。

## ページを増やす

### ゲームにページを足す

1. `games/_template/page.html` を、そのゲームのフォルダ（例: `games/county-of-fortune/`）にコピーして名前を変える
2. `<script type="text/markdown">` の中に本文を書く
3. `assets/pages.js` の、そのゲームの `pages` に1行足す

```js
{ file: "bosses.html", title: "ボス", updated: "2026-11-16" },
```

### ゲームを足す

1. `games/_template/` フォルダをまるごとコピーして、フォルダ名をゲームのID（半角英数とハイフン）にする
2. `assets/pages.js` の `games` にゲームを1件足す（既存のものをコピーして書き換える）

:::note
`pages.js` に書いた内容から、サイドバー・タブ・検索・メインページの一覧が作られます。書き忘れてもページ自体は開けますが、どこからもリンクされません。
:::

## 基本のMarkdown

````
# ページタイトル（1ページに1つ、先頭に書く）
## 大見出し（目次に載る）
### 小見出し（目次に載る）

**太字**　*斜体*　~~打ち消し~~　`コード`

- 箇条書き
  - 入れ子
1. 番号つき

[外部リンク](https://example.com)
![画像の説明](img/screenshot.png)

> 引用
````

改行は、書いたとおりに改行として表示されます。段落を分けるときは空行を入れます。

## ページへのリンク

ページのタイトルを `[[ ]]` で囲むとリンクになります。

| 書き方 | 意味 |
|---|---|
| `[[プレイメモ]]` | 同じゲームの「プレイメモ」ページ |
| `[[County of Fortune]]` | そのゲームのトップページ |
| `[[County of Fortune/やること]]` | ゲームを指定してページへ |
| `[[プレイメモ\|メモはこちら]]` | 表示する文字を変える |
| `[[#表]]` | 同じページの見出しへ |

実際の表示: [[County of Fortune]] ／ [[County of Fortune/やること]] ／ [[まだ無いページ]]

まだ作っていないページへのリンクは赤く表示されます。「あとで書く」の目印に使えます。

## ネタバレの折りたたみ

````
:::spoiler 終盤の展開
ここに書いた内容は、クリックするまで隠れます。
:::
````

:::spoiler 終盤の展開
ここに書いた内容は、クリックするまで隠れます。
- リストや表も入れられます
:::

タイトルを省くと「ネタバレ（クリックで開く）」と表示されます。

## 囲み

````
:::note 覚え書き
補足や覚え書きに使います。
:::

:::warn
取り返しのつかない要素など、注意したいことに使います。
:::

:::stub
````

:::note 覚え書き
補足や覚え書きに使います。
:::

:::warn
取り返しのつかない要素など、注意したいことに使います。
:::

:::stub

`:::stub` だけは1行で完結します（閉じの `:::` は不要）。後ろに文字を書くと、その文字が続けて表示されます。

## チェックリスト

````
- [ ] まだやっていないこと
- [x] 最初からチェック済みにしたいこと
````

- [ ] まだやっていないこと
- [x] 最初からチェック済みにしたいこと
- [ ] クリックで切り替えられます

チェックの状態は、見ているブラウザにだけ保存されます（別の端末・別のブラウザには引き継がれません）。項目の文章を書き換えると、その項目のチェックは外れます。

## 表

````
| 名前 | 価格 | メモ |
|---|---:|---|
| 木材 | 12 | 序盤から使う |
| 塩 | 40 | 高く売れる |
| 小麦 | 8 | |
````

| 名前 | 価格 | メモ |
|---|---:|---|
| 木材 | 12 | 序盤から使う |
| 塩 | 40 | 高く売れる |
| 小麦 | 8 | |

（上の表は記法の例で、実際のゲームのデータではありません）

見出しのセルをクリックすると並べ替えられます。数字の列は数値として並びます。
表の中で `[[ページ|文字]]` を使うときは、`|` を `\|` と書きます。

## 基礎情報ボックス

ページの右上に出る、Wikipedia風の情報ボックスです。`項目 | 内容` の形で1行ずつ書きます。`|` のない行は横いっぱいに表示されるので、画像を置くのに使えます。

````
:::infobox ゲームタイトル
![パッケージ画像](img/cover.jpg)
ジャンル | RPG
対応機種 | PC
発売日 | 2026年11月5日
:::
````

## 書くときの注意

- 本文の中に、script の閉じタグ（&lt;/script&gt;）をそのまま書くことはできません。そこでページが途切れます。書きたいときは `&lt;/script&gt;` と書きます。
- 画像は各ゲームのフォルダに `img/` を作って置き、`![説明](img/ファイル名.png)` で貼ります。
- 公開するWikiなので、公式の画像や他サイトの文章をそのまま載せるのは避け、自分のスクリーンショットと自分の言葉で書くのが安全です。
- ローカルでファイルを直接開いているとき、検索はタイトルとタグだけが対象です。公開後は本文も検索できます。

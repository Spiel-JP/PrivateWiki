# 生産チェーン

住民の需要と、その品物がどの建物で何から作られるかをまとめるページ。階級ごとに、需要の品物ができるまでの流れを図にしている。

住民の階級は、農民・平民・職人・貴族の4段階。どの階級の需要も、食事と日用品の2種類に分かれている。食事の需要は、食料の品物を使って自動的に満たされる。

:::note 図の見かた
- 箱ひとつが建物。「生産」は作るもの、「消費」は材料。
- 青い箱が、その図の最終的な品物を作る建物。
- 「生産」のうち太字は次の建物へ進む品物、薄い字はその図では使わない品物（副産物）。
- 数字は、稼働率100%のときの生産数と消費数。まだ入れていない。
:::

:::stub 分かったチェーンから書き足していく。

## 農民

### 食事

どれも農場ひとつで作れる。燕麦はオーツ麦のこと。

:::chain
キャベツ農場: キャベツ
カブ農場: カブ
豆農場: 豆
レンズ豆農場: レンズ豆
そば農場: そば
燕麦農場: 燕麦
:::

### 日用品

:::chain 木製チェスト
伐採場: 木材 → 木箱工房: 木製の箱
:::

:::chain 羊毛チュニック
羊牧場: 羊肉, 獣脂, 羊毛
羊毛 → 羊毛チュニック工房: 羊毛チュニック
:::

# County of Fortune

:::infobox County of Fortune
ジャンル | 街づくり・ストラテジー
開発元 | Nepos Games
発売元 | Aquila Interactive
対応機種 | PC（Windows / SteamOS・Linux）
発売日 | 2026年11月5日（早期アクセス）
価格 | 2,499円（Steam）
プレイ人数 | 1人
日本語 | 対応（インターフェース・字幕）
:::

**County of Fortune**（カウンティ・オブ・フォーチュン）は、Nepos Games が開発し Aquila Interactive が発売する、中世を舞台にした街づくりゲーム。2026年11月5日に Steam で早期アクセスが始まった。

ひとつの街に建物を1軒ずつ置くのではなく、**集落そのものを建てて、伯爵領（county）全体を育てる**のが特徴。戦闘はなく、時間に追われる要素も少ない。

:::stub リリース直後で情報が少ないため、遊びながら書き足していく。

## ゲームの特徴

プレイヤーは「lokator」（中世の入植請負人）として、まっさらな土地を任され、そこを伯爵領に育てていく。

### 集落

- 集落を置く場所と向きを自分で決める。道と建物は、集落の成長に合わせて自動で埋まっていく。
- 集落は小さな村（hamlet）から町（town）、やがて都市（city）へと育つ。
- 物資がよく行き渡ると集落が発展し、より高度な働き手が集まって、新しい品物や建物が解禁される。
- その土地の条件に合わせて、集落ごとに得意分野を持たせる。

### 土地と資源

- 資源の埋蔵地・植生・地形によって、その土地に向いた使い道が決まる。
- 気候・土壌・標高によって、育つ作物や向いている産業が変わる。
- 船が通れる川は、物流の要になる。

### 生産と物流

- 原料を加工して、より高度な品物を作る生産チェーンがある（農業・林業・鉱業など）。
- 荷車や川船が、品物を自動で運ぶ。
- 交易路は直線ではなく、川・峠・道に沿って通る。

### 市長・貴族家・文化

- **市長（Mayors）**: 集落ごとに名前のある市長がいて、特性・技能・欠点を持つ。
- **貴族家（Noble Houses）**: 市長はそれぞれ貴族家に属する。対立する家が、政治面・経済面で圧力をかけてくる。
- **文化（Cultures）**: 入植者は出身地ごとに、ボーナスや摩擦の種を持ち込む。

用語の訳は自分でつけたもの。ゲーム内の日本語表記は、分かり次第 [[プレイメモ]] に書く。

## 早期アクセス

開発元が Steam のストアページに書いている内容（2026年11月16日に確認）。

- 早期アクセスの期間は、およそ6〜9か月の見込み。
- 現時点でも最後まで遊べる状態で、集落と地域の発展、生産と物流、交易、文化、貴族家が入っている。
- 正式版に向けて、コンテンツの追加、既存システムの作り込み、新機能、見た目の改善を予定している。
- 正式版で値上げする可能性がある。その場合は事前に告知するとのこと。
- 日付入りのロードマップは、まだ公開されていない。

無料の体験版があり、進行状況は製品版に引き継げる。

## 対応言語

日本語を含む17言語に対応している。どの言語も、インターフェースと字幕のみ（音声はなし）。

## 動作環境

| | 最低 | 推奨 |
|---|---|---|
| CPU | Intel Core i3 以上 | Intel Core i5 以上 |
| メモリ | 3 GB | 4 GB |
| グラフィック | GeForce GTX 770 / Radeon R9 290 | GeForce GTX 970 / Radeon R9 390 |
| ストレージ | 2 GB | 2 GB |

ストアの表では OS が「Windows 7 以上」になっているが、Steam クライアント自体が Windows 10 以降を必要とする。

## 評判

Steam のレビューは「非常に好評」（234件中81%が好評、2026年11月16日時点）。
発売直後の記事では、コンセプト・生産チェーン・ゆったりしたペースが評価される一方、画面のごちゃつきと交易の管理に不満が出ている、と紹介されていた。

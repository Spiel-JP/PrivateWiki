## 目標

- [ ] 集落を町（town）まで育てる
- [ ] 集落を都市（city）まで育てる
- [ ] 川を使った交易路を作る
- [ ] 得意分野の違う集落を3つ以上作る

## 調べたいこと

- [ ] 実績の一覧

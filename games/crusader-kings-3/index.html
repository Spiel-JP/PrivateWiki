# Crusader Kings III

:::infobox Crusader Kings III
ジャンル | グランドストラテジー
開発元 | Paradox Development Studio
発売元 | Paradox Interactive
対応機種 | PC（Windows / macOS / Linux）、PS5、Xbox Series X\|S
発売日 | 2020年9月1日（PC）<br>2022年3月29日（PS5・Xbox）
価格 | 6,990円（Steam、本体のみ）
プレイ人数 | 1人（オンラインマルチプレイ対応）
日本語 | 対応（インターフェース・字幕）
:::

**Crusader Kings III**（クルセイダーキングスIII、略称 CK3）は、Paradox Development Studio が開発し Paradox Interactive が発売する、中世を舞台にしたグランドストラテジーゲーム。PC版は2020年9月1日に発売された。

国ではなく**ひとりの君主**を操作し、その人物が死ぬと後継ぎに操作が移る。目的は国を大きくすることよりも、**一族（王朝）を何世代にもわたって存続させ、繁栄させること**にある。

## ゲームの特徴

- **人物が主役**: 君主・廷臣・家臣のひとりひとりに能力値と特性があり、人間関係が政治を動かす。結婚、同盟、陰謀、暗殺、継承争いが遊びの中心になる。
- **世代交代**: 操作している君主が死ぬと、後継ぎを引き継いで続ける。継承の決まりによっては領地が子どもたちに分割されるので、誰に何を継がせるかが常に課題になる。
- **決まった勝利条件がない**: 最後まで一族が途絶えなければよく、何を目指すかは自分で決める。
- **エンジン**: Clausewitz Engine と、その上のツール群 Jomini で作られている。

## 開始年と終了年

本体だけで、**867年・1066年・1178年**の3つの時代から始められる。ゲームは1453年に終わる（設定で期限を外すこともできる）。

DLCで追加される開始シナリオもある。

- **Legacy of Persia**: 「Iranian Intermezzo」
- **Khans of the Steppe**: テムジン（のちのチンギス・ハン）
- **All Under Heaven**: 東アジアの開始シナリオ

## 日本語対応

PC版は、2025年10月28日のアップデート1.18「Crane」で日本語に公式対応した。それ以前は、有志の日本語化Modを使う必要があった。

Steam版の対応言語は9つ。英語のみ音声つきで、ほかはインターフェースと字幕のみ。

| 言語 | インターフェース | 音声 | 字幕 |
|---|:-:|:-:|:-:|
| 日本語 | ○ | | ○ |
| 英語 | ○ | ○ | ○ |
| フランス語 | ○ | | ○ |
| ドイツ語 | ○ | | ○ |
| スペイン語 | ○ | | ○ |
| ロシア語 | ○ | | ○ |
| 中国語（簡体字） | ○ | | ○ |
| 韓国語 | ○ | | ○ |
| ポーランド語 | ○ | | ○ |

## DLC

発売から6年のあいだに、拡張・フレーバーパック・イベントパックが多数出ている。くわしくは [[DLC一覧]] を参照。

- 最新のDLCは、2026年9月30日発売の **By God Alone**（キリスト教会の作り直し）。同時にパッチ1.20「Crozier」が配信された。
- 次の大型拡張 **Silk & Silver** が発表されている。

2025年10月の **All Under Heaven** で、マップが東アジアと東南アジアまで広がり、日本でも遊べるようになった。

## 動作環境

Steam ストアページに書かれている Windows 版の動作環境（2026年11月16日に確認）。

| | 最低 | 推奨 |
|---|---|---|
| OS | Windows 10 Home 64bit | Windows 10 Home / Windows 11 |
| CPU | Intel Core i5-750 / AMD FX 4300 | Intel Core i5-8400 / AMD Ryzen 5 1600X |
| メモリ | 8 GB | 16 GB |
| グラフィック | GeForce GTX 660 / Radeon HD 7870 など | GeForce GTX 970 / Radeon RX 480 など |
| ストレージ | 20 GB | 20 GB |

## 評判

- Metacritic のスコアは、PC版 91、PS5版 85、Xbox Series X\|S版 83。
- Steam のレビュー（英語）は「非常に好評」（50,573件中90%が好評）。直近30日に限ると「やや好評」（652件中73%）。いずれも2026年11月16日時点。

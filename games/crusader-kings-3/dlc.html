# DLC一覧

[[Crusader Kings III]] の、遊び方が変わるDLCの一覧（2026年11月16日時点）。見出しをクリックすると並べ替えられる。

| 名前 | 種類 | 発売日 | チャプター | 主な内容 |
|---|---|---|:-:|---|
| Northern Lords | フレーバーパック | 2021-03-16 | I | ヴァイキング時代の北欧。冒険者の国、盾の乙女、北欧向けの一族の遺産 |
| Royal Court | 大型拡張 | 2022-02-08 | I | 玉座の間と宮廷でのやりとり、宮廷の威光（Grandeur） |
| Fate of Iberia | フレーバーパック | 2022-05-31 | I | イベリア半島。地域をめぐる長期の争い「The Struggle」、チェスの対局 |
| Friends & Foes | イベントパック | 2022-09-08 | I | 友人とライバルにまつわるイベント100種以上、人物の「思い出」 |
| Tours & Tournaments | 大型拡張 | 2023-05-11 | II | 旅、トーナメント、大規模な催し、騎士の栄誉 |
| Wards & Wardens | イベントパック | 2023-08-22 | II | 子ども時代、教育、人質 |
| Legacy of Persia | フレーバーパック | 2023-11-09 | II | ペルシア地域。開始シナリオ「Iranian Intermezzo」 |

## 種類の違い

| 種類 | 内容 |
|---|---|
| 大型拡張（Major Expansion） | 新しいシステムを加える、いちばん大きなDLC |
| コア拡張（Core Expansion） | ゲームの土台になる仕組みを作り足す、中くらいのDLC |
| フレーバーパック（Flavor Pack） | 特定の地域や文化を掘り下げる |
| イベントパック（Event Pack） | イベントを追加する小さなDLC |

「大型拡張」などの訳は、このWikiでつけたもの。

## チャプター

DLCは「チャプター」という単位でまとめて売られていて、チャプターごとのパスを買うと、そのチャプターのDLCをまとめて入手できる。2026年11月時点で、チャプターVまで出ている。

## この表に載せていないもの

衣装・建物の見た目・音楽を追加するだけのDLC（コスメティックパック、クリエイターパック、音楽パックなど）は、この表から省いている。Steam には、本体のほかに33個のDLCが並んでいる。
